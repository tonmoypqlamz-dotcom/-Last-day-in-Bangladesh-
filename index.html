
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার গল্পের বই</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: #fff;
        }
        .book-container {
            width: 90vw;
            max-width: 500px;
            height: 70vh;
            max-height: 700px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 8px;
        }
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .page.active {
            display: flex;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #page-info {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="book-container" id="book">
        <!-- ১৬টি পাতার ছবি (আপনার ইমেজগুলোর নাম যদি page1.png, page2.png ... হয়, তবে এটি এভাবে কাজ করবে) -->
        <div class="page active"><img src="images/page1.png" alt="Page 1"></div>
        <div class="page"><img src="images/page2.png" alt="Page 2"></div>
        <div class="page"><img src="images/page3.png" alt="Page 3"></div>
        <div class="page"><img src="images/page4.png" alt="Page 4"></div>
        <div class="page"><img src="images/page5.png" alt="Page 5"></div>
        <div class="page"><img src="images/page6.png" alt="Page 6"></div>
        <div class="page"><img src="images/page7.png" alt="Page 7"></div>
        <div class="page"><img src="images/page8.png" alt="Page 8"></div>
        <div class="page"><img src="images/page9.png" alt="Page 9"></div>
        <div class="page"><img src="images/page10.png" alt="Page 10"></div>
        <div class="page"><img src="images/page11.png" alt="Page 11"></div>
        <div class="page"><img src="images/page12.png" alt="Page 12"></div>
        <div class="page"><img src="images/page13.png" alt="Page 13"></div>
        <div class="page"><img src="images/page14.png" alt="Page 14"></div>
        <div class="page"><img src="images/page15.png" alt="Page 15"></div>
        <div class="page"><img src="images/page16.png" alt="Page 16"></div>
    </div>

    <div class="controls">
        <button id="prev-btn" onclick="changePage(-1)" disabled>পূর্ববর্তী</button>
        <span id="page-info">১ / ১৬</span>
        <button id="next-btn" onclick="changePage(1)">পরবর্তী</button>
    </div>

    <script>
        let currentPage = 0;
        const pages = document.querySelectorAll('.page');
        const totalPages = pages.length;
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInfo = document.getElementById('page-info');

        function updateBook() {
            pages.forEach((page, index) => {
                page.classList.remove('active');
                if (index === currentPage) {
                    page.classList.add('active');
                }
            });
            pageInfo.innerText = `${currentPage + 1} / ${totalPages}`;
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === totalPages - 1;
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 0) currentPage = 0;
            if (currentPage >= totalPages) currentPage = totalPages - 1;
            updateBook();
        }
    </script>
</body>
</html>
